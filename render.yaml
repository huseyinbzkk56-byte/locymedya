services:
  - type: web
    name: locymedya-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: rm -rf node_modules && npm install && npm rebuild better-sqlite3 --build-from-source
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: locymedya-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://locymedya-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
