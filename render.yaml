services:
  - type: web
    name: locymedya-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0

  - type: web
    name: locymedya-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://locymedya-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
