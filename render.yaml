services:
  - type: web
    name: locymedya-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_INSTAGRAM_ACTOR_ID
        sync: false
      - key: APIFY_TIKTOK_ACTOR_ID
        sync: false
      - key: APIFY_INSTAGRAM_ACTOR_INPUT
        sync: false
      - key: APIFY_TIKTOK_ACTOR_INPUT
        sync: false

  - type: web
    name: locymedya-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://locymedya-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
